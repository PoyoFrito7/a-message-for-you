
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      color: white;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* Individual glowing stars */

    .star {
      position: fixed;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(190, 220, 255, 0.8);
      animation: twinkle infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.03;
      }

      50% {
        opacity: 0.85;
      }
    }

    /* Opening screen */

    .intro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      transition: opacity 1.5s ease;
      z-index: 2;
    }

    .intro h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: normal;
      letter-spacing: 3px;
    }

    .intro p {
      color: #b8c9d8;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    button {
      margin-top: 35px;
      padding: 12px 32px;
      color: white;
      background: transparent;
      border: 1px solid #a9c7df;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 2px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: rgba(169, 199, 223, 0.15);
    }

    .intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Area where messages appear */

    .message-area {
      position: absolute;
      inset: 5% 5%;
      display: none;
      max-width: 1600px;
      margin: auto;
      z-index: 1;
    }

    .message-area.active {
      display: block;
    }

    .floating-message {
      position: absolute;
      width: min(35%, 400px);
      padding: 12px;
      text-align: center;
      color: #ffffff;
      opacity: 0;
      transform: translate(-50%, -50%);
      animation: messageLife 10s ease forwards;
    }

    .floating-message p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.7;
      margin: 0 0 12px;
      text-shadow: 0 0 12px rgba(160, 205, 255, 0.5);
    }

    .floating-message .sender {
      font-size: 0.85rem;
      color: #a9c7df;
      letter-spacing: 1px;
    }

    @keyframes messageLife {
      0% {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 12px));
      }

      20% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      75% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 8px));
      }
    }

    /* Mobile compatibility */

    @media (max-width: 600px) {
      .message-area {
        inset: 5% 3%;
      }

      .floating-message {
        width: 90%;
        left: 50% !important;
      }

      .floating-message p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="intro" id="intro">
    <h1>A Message For You</h1>
    <p>Somewhere, someone is cheering for you.</p>
    <button onclick="beginMessages()">BEGIN</button>
  </div>

  <div class="message-area" id="messageArea"></div>

  <script>

    /* Create individual stars */

    const starCount = 35;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement("div");

      star.className = "star";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      const size = 0.8 + Math.random() * 1.2;

      star.style.width = size + "px";
      star.style.height = size + "px";

      star.style.animationDuration =
        (4 + Math.random() * 8) + "s";

      star.style.animationDelay =
        (-Math.random() * 12) + "s";

      document.body.appendChild(star);
    }

    /* Temporary example messages */

    const messages = [
      {
        text: "You are not alone. Keep moving forward.",
        sender: "A friend"
      },
      {
        text: "Even on difficult days, there are people rooting for you.",
        sender: "Someone who cares"
      },
      {
        text: "Your existence makes a difference.",
        sender: "A friend"
      },
      {
        text: "Take your time. You don't have to figure everything out today.",
        sender: "Someone cheering for you"
      },
      {
        text: "The world is better with you in it.",
        sender: "A friend"
      },
      {
        text: "Keep going. There are still wonderful things ahead.",
        sender: "Someone who believes in you"
      }
    ];

    /* Message positions across the screen */

    const positions = [
      { top: "18%", left: "24%" },
      { top: "48%", left: "76%" },
      { top: "82%", left: "35%" },
      { top: "18%", left: "76%" },
      { top: "50%", left: "25%" },
      { top: "82%", left: "76%" },
      { top: "18%", left: "35%" },
      { top: "50%", left: "65%" }
    ];

    const mobilePositions = [
      { top: "12%", left: "50%" },
      { top: "37%", left: "50%" },
      { top: "62%", left: "50%" },
      { top: "87%", left: "50%" }
    ];

    let currentMessage = 0;
    let currentPosition = 0;
    let started = false;

    function beginMessages() {

      if (started) return;
      started = true;

      document.getElementById("intro").classList.add("hidden");

      const area = document.getElementById("messageArea");

      area.classList.add("active");

      showNextMessage();

      setInterval(showNextMessage, 3000);
    }

    function showNextMessage() {

      const area = document.getElementById("messageArea");

      const message = messages[currentMessage];

      const availablePositions =
        window.innerWidth <= 600
        ? mobilePositions
        : positions;

      const position =
        availablePositions[
          currentPosition % availablePositions.length
        ];

      const card = document.createElement("div");

      card.className = "floating-message";

      card.style.top = position.top;
      card.style.left = position.left;

      const messageText = document.createElement("p");

      messageText.textContent = message.text;

      const sender = document.createElement("div");

      sender.className = "sender";
      sender.textContent = "— " + message.sender;

      card.appendChild(messageText);
      card.appendChild(sender);

      area.appendChild(card);

      setTimeout(() => {
        card.remove();
      }, 10000);

      currentMessage =
        (currentMessage + 1) % messages.length;

      currentPosition++;
    }

  </script>

</body>
</html>
