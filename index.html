
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Message For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      color: white;
      font-family: Georgia, serif;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Our subtle, glowing stars */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(1px 1px at 12% 22%, white 99%, transparent),
        radial-gradient(1px 1px at 28% 73%, #b8caff 99%, transparent),
        radial-gradient(1px 1px at 45% 16%, white 99%, transparent),
        radial-gradient(1px 1px at 67% 38%, #d6e1ff 99%, transparent),
        radial-gradient(1px 1px at 83% 78%, white 99%, transparent),
        radial-gradient(1px 1px at 91% 29%, #b8caff 99%, transparent),
        radial-gradient(1px 1px at 52% 88%, white 99%, transparent);

      background-repeat: no-repeat;

      animation: twinkle 5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.1;
        filter: drop-shadow(0 0 1px white);
      }

      50% {
        opacity: 0.9;
        filter: drop-shadow(0 0 5px #a9c4ff);
      }

      100% {
        opacity: 0.2;
        filter: drop-shadow(0 0 2px white);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 30px;
      max-width: 600px;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    p {
      color: #c5c5d5;
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      margin-top: 25px;
      padding: 12px 30px;
      background: transparent;
      border: 1px solid #aab9df;
      color: white;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: 0.4s ease;
    }

    button:hover {
      background: white;
      color: black;
      box-shadow: 0 0 15px #aab9df;
    }

    #message {
      opacity: 0;
      transition: opacity 2s ease;
    }

    #message.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>A Message For You</h1>

    <p>
      Somewhere, someone is cheering for you.
    </p>

    <button onclick="showMessage()">
      BEGIN
    </button>

    <p id="message">
      You are not alone. Keep moving forward.
    </p>

  </div>

  <script>
    function showMessage() {
      document.getElementById("message")
        .classList.add("show");
    }
  </script>

</body>
</html>
