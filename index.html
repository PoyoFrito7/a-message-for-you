

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      color: white;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* Subtle starry background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white 50%, transparent),
        radial-gradient(1px 1px at 80% 30%, white 50%, transparent),
        radial-gradient(1px 1px at 40% 70%, white 50%, transparent),
        radial-gradient(1px 1px at 70% 85%, white 50%, transparent),
        radial-gradient(1px 1px at 25% 90%, white 50%, transparent),
        radial-gradient(1px 1px at 90% 60%, white 50%, transparent);
      background-size: 300px 300px;
      opacity: 0.5;
      animation: twinkle 5s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; }
      to { opacity: 0.7; }
    }

    .intro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      transition: opacity 1.5s ease;
      z-index: 2;
    }

    .intro h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: normal;
      letter-spacing: 3px;
    }

    .intro p {
      color: #b8c9d8;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    button {
      margin-top: 35px;
      padding: 12px 32px;
      color: white;
      background: transparent;
      border: 1px solid #a9c7df;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 2px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: rgba(169, 199, 223, 0.15);
    }

    .intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Area where messages appear */
    .message-area {
      position: absolute;
      inset: 12% 5%;
      display: none;
      max-width: 1000px;
      margin: auto;
    }

    .message-area.active {
      display: block;
    }

    .floating-message {
      position: absolute;
      width: min(65%, 400px);
      padding: 12px;
      text-align: center;
      color: #ffffff;
      opacity: 0;
      animation: messageLife 10s ease forwards;
    }

    .floating-message p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.7;
      margin: 0 0 12px;
      text-shadow: 0 0 12px rgba(160, 205, 255, 0.5);
    }

    .floating-message .sender {
      font-size: 0.85rem;
      color: #a9c7df;
      letter-spacing: 1px;
    }

    @keyframes messageLife {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      20% {
        opacity: 1;
        transform: translateY(0);
      }
      75% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    @media (max-width: 600px) {
      .message-area {
        inset: 10% 3%;
      }

      .floating-message {
        width: 90%;
        left: 5% !important;
      }

      .floating-message p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="intro" id="intro">
    <h1>A Message For You</h1>
    <p>Somewhere, someone is cheering for you.</p>
    <button onclick="beginMessages()">BEGIN</button>
  </div>

  <div class="message-area" id="messageArea"></div>

  <script>
    // Temporary example messages.
    // Later, we will replace these with messages from your friends.

    const messages = [
      {
        text: "You are not alone. Keep moving forward.",
        sender: "A friend"
      },
      {
        text: "Even on difficult days, there are people rooting for you.",
        sender: "Someone who cares"
      },
      {
        text: "Your existence makes a difference.",
        sender: "A friend"
      },
      {
        text: "Take your time. You don't have to figure everything out today.",
        sender: "Someone cheering for you"
      },
      {
        text: "The world is better with you in it.",
        sender: "A friend"
      },
      {
        text: "Keep going. There are still wonderful things ahead.",
        sender: "Someone who believes in you"
      }
    ];

    const positions = [
      { top: "5%", left: "5%" },
      { top: "32%", left: "35%" },
      { top: "62%", left: "10%" },
      { top: "15%", left: "48%" }
    ];

    let currentMessage = 0;

    function beginMessages() {
      document.getElementById("intro").classList.add("hidden");

      const area = document.getElementById("messageArea");
      area.classList.add("active");

      showNextMessage();

      setInterval(showNextMessage, 3000);
    }

    function showNextMessage() {
      const area = document.getElementById("messageArea");
      const message = messages[currentMessage];
      const position = positions[currentMessage % positions.length];

      const card = document.createElement("div");
      card.className = "floating-message";

      card.style.top = position.top;
      card.style.left = position.left;

      const messageText = document.createElement("p");
      messageText.textContent = message.text;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = "— " + message.sender;

      card.appendChild(messageText);
      card.appendChild(sender);
      area.appendChild(card);

      setTimeout(() => {
        card.remove();
      }, 10000);

      currentMessage = (currentMessage + 1) % messages.length;
    }
  </script>

</body>
</html>
